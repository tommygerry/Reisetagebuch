name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:             # Manueller Start über GitHub-UI

# Nur offizielle GitHub Pages Actions brauchen diese Rechte
permissions:
  contents: read
  pages: write
  id-token: write

# Parallele Deployments verhindern; laufende Deployments werden nicht abgebrochen
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Alle Reisen validieren
        run: python main.py validate

      - name: Website bauen
        run: python main.py build

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v4

      - name: Ausgabe hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: ausgabe/

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
